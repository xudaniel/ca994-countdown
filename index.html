<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c91d26">
  <meta name="description" content="距离Emily登机时间的实时倒计时">
  <title>距离Emily登机时间</title>
  <style>
    :root {
      color-scheme: light;
      --airline-red: #d71920;
      --airline-red-deep: #b91018;
      --ink: #202326;
      --muted: #706e6a;
      --paper: #fffaf2;
      --paper-edge: #ddd4c7;
      --canvas: #f4efe7;
      --soft-line: #ded7ce;
      --stub-width: 260px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--canvas);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, "SF Pro Display", "Helvetica Neue", Arial, "PingFang SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body::before {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      height: 46px;
      background: var(--airline-red);
      content: "";
    }

    .page-shell {
      display: grid;
      min-height: 100vh;
      padding: 86px 30px 46px;
      place-items: center;
    }

    .ticket {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--stub-width);
      width: min(1360px, 100%);
      min-height: 780px;
      overflow: hidden;
      border: 1px solid var(--paper-edge);
      border-radius: 30px;
      background: var(--paper);
      box-shadow: 0 22px 58px rgba(67, 48, 27, 0.15), 0 3px 10px rgba(67, 48, 27, 0.08);
    }

    .ticket-main {
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: 42px 48px 34px;
    }

    .ticket-stub {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 44px 28px 34px;
      border-left: 2px dashed #c8bfb3;
      background: #fffdf8;
    }

    .ticket-stub::before,
    .ticket-stub::after {
      position: absolute;
      left: -19px;
      width: 36px;
      height: 36px;
      border: 1px solid var(--paper-edge);
      border-radius: 50%;
      background: var(--canvas);
      content: "";
    }

    .ticket-stub::before {
      top: -19px;
    }

    .ticket-stub::after {
      bottom: -19px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3.4vw, 3.25rem);
      font-weight: 760;
      letter-spacing: -0.055em;
      line-height: 1.08;
    }

    .status {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: 9px;
      padding: 10px 16px;
      border: 2px solid var(--airline-red);
      border-radius: 12px;
      color: var(--airline-red);
      font-size: 0.96rem;
      font-weight: 760;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--airline-red);
      box-shadow: 0 0 0 5px rgba(201, 29, 38, 0.1);
    }

    .route {
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) auto;
      align-items: center;
      gap: 24px;
      margin-top: 34px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--soft-line);
    }

    .airport-code {
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-size: clamp(4.8rem, 8vw, 7.7rem);
      font-weight: 800;
      letter-spacing: -0.055em;
      line-height: 0.9;
    }

    .route-visual {
      position: relative;
      height: 54px;
    }

    .route-line {
      position: absolute;
      top: 50%;
      right: 4px;
      left: 4px;
      height: 2px;
      background: var(--airline-red);
      transform: translateY(-50%);
    }

    .route-line::before,
    .route-line::after {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--airline-red);
      content: "";
      transform: translateY(-50%);
    }

    .route-line::before {
      left: -2px;
    }

    .route-line::after {
      right: -2px;
    }

    .route-plane {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 36px;
      height: 36px;
      padding: 5px;
      background: var(--paper);
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .flight-details {
      display: grid;
      grid-template-columns: 0.9fr 0.95fr 1.35fr;
      gap: 0;
      padding: 28px 0 30px;
    }

    .detail {
      min-width: 0;
      padding: 0 28px;
      border-left: 1px solid var(--soft-line);
    }

    .detail:first-child {
      padding-left: 0;
      border-left: 0;
    }

    .detail:last-child {
      padding-right: 0;
    }

    .detail-label,
    .stub-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 760;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .detail-value {
      display: block;
      overflow: hidden;
      font-size: clamp(1.45rem, 2.2vw, 2.05rem);
      font-weight: 760;
      letter-spacing: 0.015em;
      line-height: 1.18;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-sub {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 620;
    }

    .countdown-panel {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      min-height: 286px;
      overflow: hidden;
      border-radius: 24px;
      background: var(--ink);
      color: var(--paper);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 14px 28px rgba(32, 35, 38, 0.14);
    }

    .countdown-unit {
      position: relative;
      display: grid;
      align-content: center;
      justify-items: center;
      min-width: 0;
      padding: 26px 20px 20px;
      border-left: 1px solid rgba(255, 255, 255, 0.38);
    }

    .countdown-unit:first-child {
      border-left: 0;
    }

    .countdown-unit::after {
      position: absolute;
      top: 50%;
      right: 15%;
      left: 15%;
      height: 1px;
      background: rgba(0, 0, 0, 0.65);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
      content: "";
    }

    .countdown-value {
      position: relative;
      z-index: 1;
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-size: clamp(6.8rem, 11vw, 10.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 760;
      letter-spacing: -0.055em;
      line-height: 0.82;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
    }

    .countdown-label {
      position: relative;
      z-index: 1;
      margin-top: 26px;
      color: #eee8de;
      font-size: 1rem;
      font-weight: 720;
      letter-spacing: 0.16em;
    }

    .progress-section {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: end;
      gap: 14px;
      margin-top: auto;
      padding-top: 30px;
    }

    .progress-code {
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-size: 1.12rem;
      font-weight: 760;
      letter-spacing: 0.04em;
    }

    .progress-track {
      position: relative;
      height: 28px;
    }

    .progress-rail {
      position: absolute;
      top: 50%;
      right: 0;
      left: 0;
      height: 3px;
      border-radius: 999px;
      background: #cfc8bf;
      transform: translateY(-50%);
    }

    .progress-fill {
      position: absolute;
      top: 50%;
      left: 0;
      width: 0;
      height: 3px;
      border-radius: 999px;
      background: var(--airline-red);
      transform: translateY(-50%);
      transition: width 700ms ease;
    }

    .progress-plane {
      position: absolute;
      top: 50%;
      left: 0;
      width: 28px;
      height: 28px;
      padding: 4px;
      background: var(--paper);
      transform: translate(-50%, -50%) rotate(90deg);
      transition: left 700ms ease;
    }

    .stub-top {
      width: 100%;
      text-align: center;
    }

    .stub-kicker {
      color: var(--airline-red);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .stub-route {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    .stub-plane {
      width: 22px;
      height: 22px;
      transform: rotate(90deg);
    }

    .barcode-wrap {
      display: grid;
      width: 100%;
      height: 280px;
      margin: 24px auto 12px;
      overflow: hidden;
      place-items: center;
    }

    .barcode {
      display: block;
      width: 260px;
      height: auto;
      transform: rotate(90deg);
    }

    .stub-code {
      color: var(--muted);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-align: center;
    }

    .ticket-stub > div:nth-child(2) {
      width: 100%;
      margin-top: 14px;
    }

    .stub-bottom {
      width: 100%;
      margin-top: auto;
      padding-top: 24px;
      border-top: 1px solid var(--soft-line);
    }

    .stub-passenger {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .stub-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 22px;
    }

    .stub-value {
      display: block;
      font-size: 0.92rem;
      font-weight: 760;
      line-height: 1.35;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .ticket.arrived .status {
      border-color: var(--ink);
      color: var(--ink);
    }

    .ticket.arrived .status-dot {
      background: var(--ink);
      box-shadow: 0 0 0 5px rgba(32, 35, 38, 0.09);
    }

    @media (max-width: 960px) {
      :root {
        --stub-width: 188px;
      }

      .ticket-main {
        padding: 34px 34px 28px;
      }

      .airport-code {
        font-size: clamp(4.2rem, 9vw, 6rem);
      }

      .countdown-panel {
        min-height: 224px;
      }

      .countdown-value {
        font-size: clamp(5rem, 12vw, 7.5rem);
      }
    }

    @media (max-width: 760px) {
      body::before {
        height: 12px;
      }

      .page-shell {
        align-items: start;
        padding: 34px 12px 24px;
      }

      .ticket {
        grid-template-columns: 1fr;
        min-height: auto;
        border-radius: 24px;
      }

      .ticket-main {
        padding: 26px 22px 24px;
      }

      .ticket-stub {
        display: grid;
        grid-template-columns: 1fr 104px 1fr;
        gap: 20px;
        padding: 26px 22px;
        border-top: 2px dashed #c8bfb3;
        border-left: 0;
      }

      .ticket-stub::before,
      .ticket-stub::after {
        top: -19px;
        left: auto;
      }

      .ticket-stub::before {
        right: auto;
        left: -19px;
      }

      .ticket-stub::after {
        right: -19px;
      }

      h1 {
        font-size: clamp(1.7rem, 7vw, 2.4rem);
      }

      .status {
        padding: 8px 11px;
        font-size: 0.78rem;
      }

      .route {
        gap: 14px;
        margin-top: 28px;
        padding-bottom: 22px;
      }

      .airport-code {
        font-size: clamp(3.5rem, 17vw, 5.2rem);
      }

      .route-plane {
        width: 30px;
        height: 30px;
      }

      .flight-details {
        grid-template-columns: 1fr 1fr;
        padding: 22px 0;
      }

      .detail {
        padding: 0 16px;
      }

      .detail:nth-child(3) {
        grid-column: 1 / -1;
        margin-top: 18px;
        padding: 18px 0 0;
        border-top: 1px solid var(--soft-line);
        border-left: 0;
      }

      .detail-value {
        font-size: 1.36rem;
      }

      .countdown-panel {
        min-height: 190px;
        border-radius: 18px;
      }

      .countdown-unit {
        padding: 20px 8px 16px;
      }

      .countdown-value {
        font-size: clamp(4.1rem, 21vw, 6.2rem);
      }

      .countdown-label {
        margin-top: 22px;
        font-size: 0.83rem;
      }

      .progress-section {
        padding-top: 24px;
      }

      .stub-top {
        align-self: center;
        text-align: left;
      }

      .stub-route {
        justify-content: flex-start;
        gap: 10px;
        font-size: 1.5rem;
      }

      .barcode-wrap {
        height: auto;
        margin: 0;
      }

      .ticket-stub > div:nth-child(2) {
        margin-top: 0;
      }

      .barcode {
        width: 100%;
        transform: none;
      }

      .stub-code {
        display: none;
      }

      .stub-bottom {
        padding: 0 0 0 20px;
        border-top: 0;
        border-left: 1px solid var(--soft-line);
      }

      .stub-passenger {
        font-size: 1.2rem;
      }

      .stub-meta {
        gap: 10px;
        margin-top: 14px;
      }
    }

    @media (max-width: 430px) {
      .page-shell {
        padding-right: 8px;
        padding-left: 8px;
      }

      .title-row {
        align-items: flex-start;
        gap: 12px;
      }

      .status {
        gap: 6px;
        padding: 7px 9px;
      }

      .status-dot {
        display: none;
      }

      .route {
        gap: 10px;
      }

      .airport-code {
        font-size: clamp(3.1rem, 16vw, 4.4rem);
      }

      .route-visual {
        height: 42px;
      }

      .countdown-panel {
        min-height: 166px;
      }

      .countdown-value {
        font-size: clamp(3.25rem, 20vw, 5rem);
      }

      .countdown-label {
        margin-top: 20px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
      }

      .progress-code {
        font-size: 0.92rem;
      }

      .ticket-stub {
        grid-template-columns: 1fr 82px;
      }

      .stub-bottom {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill,
      .progress-plane {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="ticket" id="boarding-ticket" aria-labelledby="countdown-title">
      <div class="ticket-main">
        <div class="title-row">
          <h1 id="countdown-title">距离Emily登机时间</h1>
          <div class="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="countdown-state">倒计时中</span>
          </div>
        </div>

        <div class="route" aria-label="多伦多飞往北京">
          <span class="airport-code">YYZ</span>
          <div class="route-visual" aria-hidden="true">
            <span class="route-line"></span>
            <img class="route-plane" src="assets/airplane-fill.svg" alt="">
          </div>
          <span class="airport-code">PEK</span>
        </div>

        <div class="flight-details">
          <div class="detail">
            <span class="detail-label">Flight · 航班</span>
            <span class="detail-value">CA994</span>
          </div>
          <div class="detail">
            <span class="detail-label">Passenger · 乘客</span>
            <span class="detail-value">EMILY</span>
          </div>
          <div class="detail">
            <span class="detail-label">Boarding · 登机时间</span>
            <time class="detail-value" datetime="2026-08-28T01:15:00+08:00">2026年8月28日 01:15</time>
            <span class="detail-sub">北京时间 · Asia/Shanghai</span>
          </div>
        </div>

        <div class="countdown-panel" role="timer" aria-label="距离Emily登机时间的倒计时">
          <div class="countdown-unit">
            <strong class="countdown-value" id="hours">00</strong>
            <span class="countdown-label">小时</span>
          </div>
          <div class="countdown-unit">
            <strong class="countdown-value" id="minutes">00</strong>
            <span class="countdown-label">分钟</span>
          </div>
          <div class="countdown-unit">
            <strong class="countdown-value" id="seconds">00</strong>
            <span class="countdown-label">秒</span>
          </div>
        </div>

        <div class="progress-section" aria-label="距登机时间进度">
          <span class="progress-code">YYZ</span>
          <div class="progress-track" aria-hidden="true">
            <span class="progress-rail"></span>
            <span class="progress-fill" id="progress-fill"></span>
            <img class="progress-plane" id="progress-plane" src="assets/airplane-fill.svg" alt="">
          </div>
          <span class="progress-code">PEK</span>
        </div>
      </div>

      <aside class="ticket-stub" aria-label="Emily的电子登机牌票根">
        <div class="stub-top">
          <span class="stub-kicker">BOARDING PASS</span>
          <div class="stub-route">
            <span>YYZ</span>
            <img class="stub-plane" src="assets/airplane-fill.svg" alt="" aria-hidden="true">
            <span>PEK</span>
          </div>
        </div>

        <div>
          <div class="barcode-wrap">
            <img class="barcode" src="assets/boarding-barcode.svg" alt="CA994电子登机牌条码">
          </div>
          <div class="stub-code">994 · 0828 · EMILY</div>
        </div>

        <div class="stub-bottom">
          <span class="stub-label">Passenger</span>
          <div class="stub-passenger">EMILY</div>
          <div class="stub-meta">
            <div>
              <span class="stub-label">Flight</span>
              <span class="stub-value">CA994</span>
            </div>
            <div>
              <span class="stub-label">Time</span>
              <span class="stub-value">01:15<br>北京</span>
            </div>
          </div>
        </div>
      </aside>

      <p class="sr-only" id="countdown-accessible" aria-live="polite"></p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var targetMs = Date.parse("2026-08-28T01:15:00+08:00");
      var progressStartMs = Date.parse("2026-08-26T01:15:00+08:00");
      var ticket = document.getElementById("boarding-ticket");
      var state = document.getElementById("countdown-state");
      var hours = document.getElementById("hours");
      var minutes = document.getElementById("minutes");
      var seconds = document.getElementById("seconds");
      var accessible = document.getElementById("countdown-accessible");
      var progressFill = document.getElementById("progress-fill");
      var progressPlane = document.getElementById("progress-plane");
      var previousAccessibleMinute = null;

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function update() {
        var now = Date.now();
        var remainingMs = Math.max(0, targetMs - now);
        var totalSeconds = Math.floor(remainingMs / 1000);
        var hourValue = Math.floor(totalSeconds / 3600);
        var minuteValue = Math.floor((totalSeconds % 3600) / 60);
        var secondValue = totalSeconds % 60;
        var progress = Math.min(1, Math.max(0, (now - progressStartMs) / (targetMs - progressStartMs)));
        var progressPercent = (progress * 100).toFixed(3) + "%";

        hours.textContent = pad(hourValue);
        minutes.textContent = pad(minuteValue);
        seconds.textContent = pad(secondValue);
        progressFill.style.width = progressPercent;
        progressPlane.style.left = progressPercent;

        if (remainingMs <= 0) {
          ticket.classList.add("arrived");
          state.textContent = "登机时间已到";
          accessible.textContent = "Emily登机时间已到。";
          document.title = "登机时间已到 · Emily";
          return;
        }

        ticket.classList.remove("arrived");
        state.textContent = "倒计时中";
        document.title = pad(hourValue) + ":" + pad(minuteValue) + ":" + pad(secondValue) + " · 距离Emily登机时间";

        var accessibleMinute = hourValue * 60 + minuteValue;
        if (accessibleMinute !== previousAccessibleMinute) {
          accessible.textContent = "距离Emily登机时间还有" + hourValue + "小时" + minuteValue + "分钟。";
          previousAccessibleMinute = accessibleMinute;
        }
      }

      update();
      window.setInterval(update, 1000);
    }());
  </script>
</body>
</html>
